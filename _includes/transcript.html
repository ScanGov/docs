{% set transcriptParagraphs = transcripts[transcriptId] %}
{% if transcriptParagraphs %}
<div class="accordion">
  <div class="accordion-item">
    <h2 class="accordion-header" id="transcript-{{ transcriptId }}-heading">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#transcript-{{ transcriptId }}-collapse" aria-expanded="false" aria-controls="transcript-{{ transcriptId }}-collapse">
        <i class="fa-solid fa-file-lines me-2" aria-hidden="true"></i>Transcript
      </button>
    </h2>
    <div id="transcript-{{ transcriptId }}-collapse" class="accordion-collapse collapse" aria-labelledby="transcript-{{ transcriptId }}-heading">
      <div class="accordion-body">
        {% for paragraph in transcriptParagraphs %}
        <p>{{ paragraph }}</p>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endif %}
